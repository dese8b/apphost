



# 基本信息
name: cliproxyapi
version: 1.0.0
description: 应用描述
author: your-name

# 依赖安装（可选）
install:
  commands:             # 多行命令
    - tool hf-store
    - hf-store  restore  cpa-8313  ./

# 启动配置（必需）
start:
  script: ./start.sh                    # 脚本路径

# 本地路由（必需）
routes:
  - path: /cliproxyapi          # 相对路径，实际为 /apps/{name}/
    target: http://localhost:8313
    strip_prefix: false

# 远程隧道（可选）
tunnels:
  - name: cf-tunnel
    type: http
    enabled: true
    target: 
    config:

storage:
  - type: hf-store 
  - sync: true 
  - local_path: ./
  - remote_path:  cpa-8313

# 元数据（可选）
metadata:
  tags: [web, demo]
  homepage: https://example.com
  repository: https://github.com/user/repo